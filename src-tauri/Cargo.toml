[package]
name = "alpha-premier-attendance"
version = "0.1.0"
description = "Alpha Premier Attendance desktop application"
authors = ["Alpha Premier"]
edition = "2021"
rust-version = "1.88"
build = "build.rs"

[lib]
name = "alpha_premier_attendance_lib"
crate-type = ["cdylib", "rlib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
axum = "0.7"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
chrono-tz = "0.10"
csv = "1.3"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ipnet = { version = "2", features = ["serde"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rdev = "0.5"
rust_xlsxwriter = { version = "0.97.0", features = ["chrono", "constant_memory"] }
printpdf = { version = "0.12.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate", "chrono"] }
thiserror = "2"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
urlencoding = "2"
