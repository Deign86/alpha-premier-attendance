[package]
name = "alpha-premier-attendance"
default-run = "alpha-premier-attendance"
version = "0.1.37"
description = "Alpha Premier Attendance desktop application"
authors = ["Alpha Premier"]
edition = "2021"
rust-version = "1.88"
build = "build.rs"

[lib]
name = "alpha_premier_attendance_lib"
crate-type = ["cdylib", "rlib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
axum = "0.7"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
chrono-tz = "0.10"
csv = "1.3"
futures-util = "0.3"
get_if_addrs = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ipnet = { version = "2", features = ["serde"] }
jsonwebtoken = "9"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_xlsxwriter = { version = "0.97.0", features = ["chrono", "constant_memory"] }
printpdf = { version = "0.12.5", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate", "chrono"] }
thiserror = "2"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "time", "process"] }
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
urlencoding = "2"
zip = "8"
tauri-plugin-mcp-bridge = "0.12.0"
rodio = { version = "0.19", default-features = false, features = ["wav"] }

[dev-dependencies]
# Used only by tests to read back generated XLSX metadata.
zip = "8"

[profile.dev]
incremental = true

# Optimize external dependencies in development/test builds to keep test runtime fast
[profile.dev.package."*"]
opt-level = 2

# Optimized production release profile: thin LTO and 16 codegen units give fast compile times with high runtime performance
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
