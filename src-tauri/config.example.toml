# Copy to the Tauri app config directory as config.toml on the front-desk laptop.
# Keep this file private. The LAN server is disabled unless explicitly enabled.
#
# Portable mode: create an empty `portable.dat` next to the portable .exe and
# data (SQLite, photos, exports) moves to `Data/` beside the executable; a
# `config.toml` next to the executable is used when present.

[lan]
# Auto-start the LAN attendance viewer when the app boots. The viewer can also
# be started on demand from the Live Attendance screen even when this is false.
enabled = true
# Allow the Live Attendance screen to start the viewer when `enabled = false`.
# Set to false to disable the viewer entirely (state shows as Disabled).
allow_runtime_start = true
# Leave unset (recommended) to auto-detect the front-desk laptop's active
# office Wi-Fi/LAN IP, or set a specific private IPv4 (never localhost) that is
# actually assigned to this laptop (use `ipconfig` to confirm). A stale or
# missing bind address is the most common reason the viewer works on the laptop
# but phones on the same Wi-Fi cannot open it.
# bind_address = "192.168.1.25"
port = 4173
allow_wildcard_bind = false
allowed_subnets = ["192.168.1.0/24"]
auth_mode = "password"
# SHA-256 hex digest of the viewer token sent as X-Viewer-Token.
viewer_password_hash = ""
viewer_session_minutes = 480
sse_keep_alive_seconds = 15

# Local admin PIN for protected card association.
admin_pin = "293906"
admin_session_minutes = 15

# Native RFID scanner pipeline. The scanner is captured at the Rust layer and
# surfaced to the UI as `rfid-scan` events, so card taps work without a focused
# webview text box.
[scanner]
# "keyboard" (default): the reader behaves as a keyboard wedge and types the
# card UID followed by Enter. A global low-level keyboard hook captures the
# stream even when the webview is not focused.
# "hid": raw HID access to a true HID reader; requires hid_vid/hid_pid below.
# "auto": use HID when hid_vid/hid_pid are set, otherwise keyboard wedge.
mode = "keyboard"
# Most keyboard-wedge readers append Enter after the UID. Set false when the
# reader only types the UID (the app then completes scans by idle timeout).
enter_suffix = true
# Fallback completion window (ms) when the reader does not send Enter; also the
# silence gap that separates two card taps.
idle_timeout_ms = 150
# Native duplicate window (ms): identical UIDs read within this window are
# swallowed so one physical tap never produces two scan requests. The backend
# keeps its own 500 ms guard and 10 s physical cooldown for the UI feedback.
dedup_ms = 300
# Raw HID mode only: vendor/product id of the RFID reader (hex, e.g. 0x1234).
hid_vid = 0
hid_pid = 0

# Canonical company office identity shown across the kiosk, dashboard, exports,
# and printed references. All values are configurable; the defaults are the real
# office. office_postal_code is optional and intentionally unset until confirmed.
[office]
company_name = "Alpha Premier"
office_label = "Main Office"
office_address_line_1 = "Unit 3104C"
office_building = "Tektite East Tower"
office_district = "Ortigas Center"
office_city = "Pasig"
office_region = "Metro Manila"
office_country = "Philippines"
office_postal_code = ""
office_display_short = "Tektite East Tower, Ortigas Center, Pasig"
office_display_full = "Unit 3104C, Tektite East Tower, Ortigas Center, Pasig, Metro Manila"

# Optional HTTPS exporter endpoint used by the bounded sync worker.
sheets_sync_endpoint = ""
google_service_account_json_path = ""
google_spreadsheet_id = ""

# Local SQLite database location. Optional — leave unset to use the default
# `attendance.db` inside the app data directory
# (%LOCALAPPDATA%\com.alphapremier.attendance, or `Data/` next to the .exe in
# portable mode). Set this when the database must live somewhere stable and
# shared (e.g. a D: drive) so a PC replacement never touches the data.
#
# A value with a file extension (or an existing file) is treated as the
# database file itself; a value without one is treated as a directory and
# `attendance.db` is appended. Relative paths resolve against this config
# directory (next to the executable in portable mode).
#
# The ALPHA_PREMIER_DB_PATH environment variable is a lower-priority override.
# Moving a database between PCs: use Admin -> Data and backup (Create backup /
# Restore from backup file) — see docs/database-migration.md. Never copy a
# live attendance.db while the app is open.
[database]
path = ""
