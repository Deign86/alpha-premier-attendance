name: Release

on:
  push:
    tags:
      - 'v*'

# Workflow-level permissions: creating/updating the GitHub Release
# (tauri-action POST /releases) requires contents:write, and the repo's
# Actions default is read-only. Mirrored at job level below.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and target artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint:oxlint

      - name: Test
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Check embedded sheets-key secret
        shell: bash
        run: if [ -z "${{ secrets.ALPHA_PREMIER_EMBED_KEY_JSON }}" ]; then echo "::error::Missing ALPHA_PREMIER_EMBED_KEY_JSON repo secret (full service-account JSON). GitHub Releases must ship DTR-connected."; exit 1; fi

      - name: Build Tauri app and attach to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ALPHA_PREMIER_EMBED_KEY_JSON: ${{ secrets.ALPHA_PREMIER_EMBED_KEY_JSON }}
          # Fail closed: build.rs panics without an embedded key when this is 1.
          ALPHA_PREMIER_REQUIRE_EMBED_KEY: "1"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
