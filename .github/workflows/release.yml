name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

# Workflow-level permissions: creating/updating the GitHub Release
# (tauri-action POST /releases) requires contents:write, and the repo's
# Actions default is read-only. Mirrored at job level below.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-windows:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version_step.outputs.tag }}
      version: ${{ steps.version_step.outputs.version }}
      release_id: ${{ steps.tauri.outputs.releaseId }}
    steps:
      # The version bump is pushed straight to main, which the "main: CI must
      # pass" ruleset blocks for everyone but deploy keys, so check out (and
      # push) with the write deploy key instead of GITHUB_TOKEN.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - parallel:
          - name: Setup Node
            uses: actions/setup-node@v4
            with:
              node-version: 22
              cache: npm

          - name: Setup Rust
            uses: dtolnay/rust-toolchain@stable

      - parallel:
          - name: Cache Rust dependencies and target artifacts
            uses: swatinem/rust-cache@v2
            with:
              workspaces: "src-tauri"

          - name: Install dependencies
            run: npm ci

      - name: Resolve and bump version
        id: version_step
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/bump-version.mjs --commit

      - parallel:
          - name: Verify JavaScript and build frontend
            shell: bash
            run: |
              npm run typecheck
              npm run lint
              npm test
              npm run build:fast

          - name: Run Rust tests (match CI suite)
            run: cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1
            env:
              ALPHA_PREMIER_REQUIRE_EMBED_KEY: "0"

      - name: Check embedded sheets-key secret
        shell: bash
        run: if [ -z "${{ secrets.ALPHA_PREMIER_EMBED_KEY_JSON }}" ]; then echo "::error::Missing ALPHA_PREMIER_EMBED_KEY_JSON repo secret (full service-account JSON). GitHub Releases must ship DTR-connected."; exit 1; fi

      - name: Check PIN reset mailer secret
        shell: bash
        run: if [ -z "${{ secrets.ALPHA_PREMIER_PIN_RESET_URL }}" ]; then echo "::error::Missing ALPHA_PREMIER_PIN_RESET_URL repo secret (Apps Script web app URL, see scripts/pin-reset-mailer/Code.gs). Releases must ship the admin PIN email reset."; exit 1; fi

      # The release stays a draft until publish-release: a published release is
      # what the updater's releases/latest/download/latest.json serves, and it
      # must not go out before every platform is in its latest.json.
      - name: Build Tauri app and attach to release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ALPHA_PREMIER_EMBED_KEY_JSON: ${{ secrets.ALPHA_PREMIER_EMBED_KEY_JSON }}
          # Baked in via option_env! for the Forgot-PIN email (services/admin_pin.rs).
          ALPHA_PREMIER_PIN_RESET_URL: ${{ secrets.ALPHA_PREMIER_PIN_RESET_URL }}
          # Fail closed: build.rs panics without an embedded key when this is 1.
          ALPHA_PREMIER_REQUIRE_EMBED_KEY: "1"
        with:
          tagName: v__VERSION__
          releaseName: 'Alpha Premier Attendance v__VERSION__'
          releaseDraft: true
          prerelease: false

  # Native macOS .app/.dmg (one per arch) attached to the same draft release.
  # Runs after Windows so it builds the bumped version, and tauri-action merges the
  # darwin entries into the release's latest.json. Per-arch rather than
  # universal-apple-darwin: the universal bundler only lipo-merges the main
  # binary and then fails to copy the extra `migrate_from_sheets` bin.
  # max-parallel 1 keeps the two latest.json merges from racing.
  build-macos:
    needs: build-windows
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      # The draft release has no git tag until it is published; its target is
      # this run's commit, which the tag used to point at.
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies and target artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"
          key: ${{ matrix.target }}

      - name: Install dependencies and build frontend
        run: |
          npm ci
          npm run build:fast

      # The release commit is the pre-bump commit, so stamp the bumped
      # version; otherwise the Mac bundle and the merged latest.json carry
      # the previous version and break auto-update for every platform.
      - name: Stamp release version
        env:
          VERSION: ${{ needs.build-windows.outputs.version }}
        run: |
          node -e 'const fs=require("fs"),f="src-tauri/tauri.conf.json",c=JSON.parse(fs.readFileSync(f,"utf8"));c.version=process.env.VERSION;fs.writeFileSync(f,JSON.stringify(c,null,2)+"\n")'
          grep '"version"' src-tauri/tauri.conf.json

      - name: Build Tauri app and attach to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ALPHA_PREMIER_EMBED_KEY_JSON: ${{ secrets.ALPHA_PREMIER_EMBED_KEY_JSON }}
          ALPHA_PREMIER_PIN_RESET_URL: ${{ secrets.ALPHA_PREMIER_PIN_RESET_URL }}
          ALPHA_PREMIER_REQUIRE_EMBED_KEY: "1"
        with:
          releaseId: ${{ needs.build-windows.outputs.release_id }}
          tagName: ${{ needs.build-windows.outputs.tag }}
          releaseName: 'Alpha Premier Attendance ${{ needs.build-windows.outputs.tag }}'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  # Publishes the draft only when Windows and both Macs are attached and its
  # latest.json lists every platform. Until then the updater keeps serving the
  # previous complete release, so no installed copy sees a missing platform
  # ("None of the fallback platforms ... were found"). If a build fails the
  # release stays a draft; rerun the failed job and this one publishes it.
  publish-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check latest.json lists every platform, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.build-windows.outputs.release_id }}
          VERSION: ${{ needs.build-windows.outputs.version }}
        run: |
          set -euo pipefail
          asset_id=$(gh api "repos/$REPO/releases/$RELEASE_ID/assets" --jq '.[] | select(.name == "latest.json") | .id')
          [ -n "$asset_id" ] || { echo "::error::Release $RELEASE_ID has no latest.json"; exit 1; }
          gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$asset_id" > latest.json
          node -e '
            const m = JSON.parse(require("fs").readFileSync("latest.json", "utf8"));
            const need = ["windows-x86_64", "darwin-aarch64", "darwin-x86_64"];
            const missing = need.filter((p) => !m.platforms?.[p]?.url || !m.platforms[p].signature);
            if (m.version !== process.env.VERSION) { console.log(`::error::latest.json is version ${m.version}, expected ${process.env.VERSION}`); process.exit(1); }
            if (missing.length) { console.log(`::error::latest.json is missing ${missing.join(", ")}`); process.exit(1); }
            console.log(`latest.json ${m.version}: ${Object.keys(m.platforms).sort().join(", ")}`);
          '
          gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" -F draft=false -f make_latest=true --jq '"Published " + .tag_name'

