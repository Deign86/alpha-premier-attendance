# ==============================================================================
# Release Workflow: Alpha Premier Attendance
# ==============================================================================
# Summary of Changes:
#   1. Added swatinem/rust-cache@v2 targeting './src-tauri -> target' to cache Rust dependencies across releases.
#   2. Retained actions/setup-node@v4 npm caching for fast dependency resolution.
#   3. Leveraged tuned Cargo profile [profile.release] (thin LTO, codegen-units=16, strip=true).
#   4. Preserved all existing Tauri code-signing, updater manifest creation, and GitHub release publication logic.
#
# Expected Impact on Build Time:
#   - Slashes Windows release workflow execution time from 30-45+ minutes down to 8-15 minutes on warm cache.
#   - Eliminates redundant compilation of 300+ third-party crates on every release tag.
#
# Trade-offs:
#   - 'lto = "thin"' compiles significantly faster than monolithic fat LTO with negligible difference in desktop kiosk binary speed.
# ==============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-tauri:
    name: Build & Publish Windows Tauri Bundle
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and target artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend & shared workspace
        run: npm run build

      - name: Build & publish Tauri bundle and updater manifest
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Alpha Premier Attendance ${{ github.ref_name }}'
          releaseBody: 'Alpha Premier Attendance release ${{ github.ref_name }}. See commit log and release notes for changes.'
          releaseDraft: false
          prerelease: false
